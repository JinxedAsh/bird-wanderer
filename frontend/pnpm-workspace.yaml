allowBuilds:
  '@firebase/util': false
  esbuild: true
  protobufjs: false

# Keep the audited fixes even where a transitive dependency pins an older range.
# grpc stays within major1; Firestore is installed by Firebase but unused here.
overrides:
  '@grpc/grpc-js@<1.13.6': 1.13.6
  'body-parser@<1.20.9': 1.20.9
